# Static-file server only. The host nginx on the VPS terminates TLS for
# partner.mavioglobal.com and routes /api/portal/ to 127.0.0.1:8002 and / to
# 127.0.0.1:5181 (this container).
#
# Do NOT add an /api/ proxy block here. On the internal portal that would merely
# double-proxy; here it would route around the host config that makes the staff API
# unreachable from the partner hostname — the restriction is the point, not a detail.
#
# Same shape as KIORA's dietportal/nginx.conf; see backend/deploy/nginx/ for the host
# side.

server {
    listen 80;

    server_name _;

    # `always` so these are sent on error responses too, not just 2xx.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Stock nginx:alpine only gzips text/html, and the host nginx will not compress a
    # proxied response either (gzip_proxied defaults to off). Left alone the bundle goes
    # out at 385 kB instead of 120 kB. Vite emits no .gz files, so gzip_static is out.
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Load-bearing: nginx proxies upstream with HTTP/1.0 unless told otherwise, and the
    # gzip module's default gzip_http_version is 1.1 — so every request arriving from
    # the host nginx would be exempt from compression and the bundle would go out at
    # 385 kB instead of 120 kB. Verified on the internal portal, where gzip silently did
    # nothing until this line existed. Fixed here rather than with proxy_http_version on
    # the host so this container is correct behind any front end, not just ours.
    gzip_http_version 1.0;

    # Vite content-hashes everything under /assets/, so a 1y immutable cache is safe —
    # a new build produces new filenames.
    location /assets/ {
        root /usr/share/nginx/html;
        # One add_header, not `expires 1y` plus an add_header: those emit two separate
        # Cache-Control headers (max-age=31536000 and public, immutable) and leave it to
        # the client to merge them.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # nginx gotcha: a location that declares its own add_header discards ALL
        # inherited server-level add_headers, so the three security headers above must
        # be repeated here or they would silently vanish for /assets/ responses.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback. Load-bearing, not cosmetic: react-router owns /profile, /documents,
    # /account and /reset-password — that last one is a mailed link, so a 404 on it is a
    # partner who cannot set their password.
    #
    # index.html must NEVER be cached: it is the pointer to the hashed bundles, so a
    # cached copy pins an open tab to a build whose assets no longer exist. No expires
    # and no Cache-Control here on purpose.
    #
    # `$uri/` is not redundant: for a request to `/`, `$uri` alone tests the directory
    # as a file and fails, so without it the root URL never reaches the index directive.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
