# Host nginx vhost for partner.mavioglobal.com — the partner-facing portal.
#
# This file is the only thing standing between a partner's browser and the staff API, so
# read the /api blocks before editing either of them.
#
# Lives in THIS repo, not the backend's, so partner-portal can be deployed without a
# backend checkout on the box. The proxy_set_header lines are repeated per location
# rather than pulled from a shared snippet for the same reason — copied, not linked, as
# CLAUDE.md has it.
#
# Committed as reference only; nothing applies it automatically. To install:
#   sudo install -m 644 deploy/nginx/partner.mavioglobal.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/partner.mavioglobal.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d partner.mavioglobal.com   # rewrites this file with the TLS block
#
# A partner is a second principal entirely (see the backend's app/routers/portal.py
# module docstring): a non-employee holding a session on the same service that serves
# staff. The app defends that boundary on every route. This config is the second,
# cheaper layer — the staff endpoints are not merely rejected from this hostname, they
# are not routed at all, so a future route that forgets its permission check is still
# unreachable from here.
#
# One hostname serves supplier, buyer and logistics_cha. src/config/portals.js reads the
# kind off the session at runtime, so all three of the backend's *_PORTAL_URL settings
# point here and nothing renders differently per hostname.

server {
    listen 80;
    server_name partner.mavioglobal.com;

    # `^~` so a prefix match here stops nginx considering any regex location, and the
    # catch-all 404 below can never shadow this. The whole partner API surface is under
    # this one prefix: src/services/api.js calls only /portal/auth/* and /portal/me/*.
    location ^~ /api/portal/ {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing on this portal uploads — v1 is read plus account. Left small on
        # purpose: if a partner-side upload is added later, raise it deliberately rather
        # than discover it was already open.
        client_max_body_size 1m;

        # /portal/me/pdf is generated per request.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else under /api is staff-only: /api/partners carries Mavio's internal
    # verification and can name other partners, /api/users and /api/roles are governance,
    # /api/onboarding/spec returns every section including the internal ones.
    #
    # 404 rather than 403: a 403 confirms the endpoint exists, and the SPA's fetch
    # wrapper treats 401/403 as "session is stale" and bounces the user to /login — a
    # confusing logout instead of a clear dead end.
    #
    # /api/review is NOT here. The review page lives in the internal portal build, not
    # this one. If it ever moves, add a `location ^~ /api/review/` block above this.
    location ^~ /api/ {
        return 404;
    }

    # The SPA container. Static files and the react-router fallback are its own
    # nginx.conf's job; this just forwards.
    location / {
        proxy_pass http://127.0.0.1:5181;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
